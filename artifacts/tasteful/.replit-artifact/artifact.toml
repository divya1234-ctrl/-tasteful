kind = "web"
previewPath = "/"
title = "Tasteful — Order Food"
version = "1.0.0"
id = "artifacts/tasteful"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20350

[services.development]
run = "pnpm --filter @workspace/tasteful run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tasteful", "run", "build" ]
publicDir = "artifacts/tasteful/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20350"
BASE_PATH = "/"
